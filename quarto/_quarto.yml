project:
  type: default
  output-dir: ../content/posts  # Quarto renders directly into Hugo's posts folder

format:
  hugo-md:
    toc: false
    anchor-sections: true
    code-fold: false
    code-tools: false
    df-print: default

execute:
  freeze: auto           # cache render outputs; re-render only when source changes
  echo: true
  warning: false
  message: false
