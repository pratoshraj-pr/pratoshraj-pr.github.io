<rect x="844" y="614" width="60" height="30" rx="6" fill="#5b5fc7" fill-opacity="0.05" stroke="#5b5fc7" stroke-width="1.6" stroke-opacity="0.45"/>
<text x="874" y="635" text-anchor="middle" class="sans" style="font-size:16px;font-weight:700;opacity:0.45">0</text>
