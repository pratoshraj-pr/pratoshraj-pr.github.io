<text x="1010" y="635" text-anchor="middle" class="sans" style="font-size:16px;font-weight:700;opacity:1">1</text>
<text x="56" y="682" class="i" style="font-size:15.5px">Not a readable email — the model generates word frequencies, not coherent text.</text>
<text x="1050" y="682" text-anchor="end" class="small sans">compare with LM sampling later</text>
</svg>