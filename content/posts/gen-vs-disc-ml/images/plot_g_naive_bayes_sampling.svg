<rect x="912" y="614" width="60" height="30" rx="6" fill="#8c5a3c" fill-opacity="0.05" stroke="#8c5a3c" stroke-width="1.6" stroke-opacity="0.45"/>
<text x="942" y="635" text-anchor="middle" class="sans" style="font-size:16px;font-weight:700;opacity:0.45">0</text>
<text x="1010" y="608" text-anchor="middle" class="sans" style="font-size:11px">thanks</text>
