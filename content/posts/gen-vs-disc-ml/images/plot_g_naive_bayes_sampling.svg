<text x="721.0" y="484" text-anchor="middle" class="sans" style="font-size:15px;font-weight:600">prize</text>
<text x="721.0" y="516" text-anchor="middle" class="small i">x<tspan dy="4" font-size="10">6</tspan></text>
<path d="M550,402 C550,434 835.0,430 835.0,456" class="arrow" marker-end="url(#head)"/>
<rect x="785.0" y="462" width="100" height="34" rx="8" fill="#d98b1c" fill-opacity=".16" stroke="#d98b1c" stroke-width="1.8"/>
<text x="835.0" y="484" text-anchor="middle" class="sans" style="font-size:15px;font-weight:600">free</text>
<text x="835.0" y="516" text-anchor="middle" class="small i">x<tspan dy="4" font-size="10">7</tspan></text>
<path d="M550,402 C550,434 949.0,430 949.0,456" class="arrow" marker-end="url(#head)"/>
<rect x="899.0" y="462" width="100" height="34" rx="8" fill="#1b9bb5" fill-opacity=".16" stroke="#1b9bb5" stroke-width="1.8"/>
<text x="949.0" y="484" text-anchor="middle" class="sans" style="font-size:15px;font-weight:600">click</text>
<text x="949.0" y="516" text-anchor="middle" class="small i">x<tspan dy="4" font-size="10">8</tspan></text>
<text x="550" y="406" text-anchor="middle" class="small sans" style="font-size:11.5px;display:none"></text>
<rect x="30" y="556" width="1040" height="144" rx="10" class="card"/>
<text x="56" y="588" class="h sans">Result</text>
<text x="56" y="624" class="mono" style="font-size:18px">prize free click free thanks prize free click</text>
<text x="56" y="646" class="small sans">order is meaningless: any shuffle of these 8 words is equally likely</text>
<text x="640" y="588" class="small" style="font-size:14px"><tspan class="i">t</tspan>(<tspan class="i">x</tspan>) = (3, 2, 2, 0, 0, 1)  <tspan class="sans" style="font-size:12px">count vector</tspan></text>
<text x="670" y="608" text-anchor="middle" class="sans" style="font-size:11px">free</text>
<rect x="640" y="614" width="60" height="30" rx="6" fill="#d98b1c" fill-opacity="0.16" stroke="#d98b1c" stroke-width="1.6" stroke-opacity="1"/>
<text x="670" y="635" text-anchor="middle" class="sans" style="font-size:16px;font-weight:700;opacity:1">3</text>
<text x="738" y="608" text-anchor="middle" class="sans" style="font-size:11px">prize</text>
<rect x="708" y="614" width="60" height="30" rx="6" fill="#5c9a2e" fill-opacity="0.16" stroke="#5c9a2e" stroke-width="1.6" stroke-opacity="1"/>
