<line x1="761" y1="316" x2="897" y2="316" class="axis"/>
<text x="761.0" y="332" text-anchor="middle" class="small sans">−6</text>
<text x="829.0" y="332" text-anchor="middle" class="small sans">0</text>
<text x="897.0" y="332" text-anchor="middle" class="small sans">6</text>
<text x="899" y="348" text-anchor="end" class="i">z</text>
<text x="735" y="142" class="i">σ</text>
<line x1="865.3" y1="316" x2="865.3" y2="156.5" stroke="var(--spam)" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="761" y1="156.5" x2="865.3" y2="156.5" stroke="var(--spam)" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="865.3" cy="156.5" r="5" fill="var(--spam)" stroke="#fff" stroke-width="1.5"/>
<text x="857.3" y="308" text-anchor="end" class="halo sans" style="font-size:12.5px;fill:var(--spam);font-weight:600">z = 3.2</text>
<text x="767" y="150.5" class="sans" style="font-size:12px;font-weight:600;fill:var(--spam)">0.96</text>
