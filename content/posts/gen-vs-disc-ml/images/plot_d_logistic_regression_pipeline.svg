<text x="967" y="208" class="sans" style="font-size:13.5px;font-weight:600;fill:var(--spam)">P(spam) = 0.96</text>
<path d="M1121.9,254 V272 " stroke="var(--ham)" stroke-width="1.6" fill="none"/>
<text x="1125" y="288" text-anchor="end" class="sans" style="font-size:13.5px;font-weight:600;fill:var(--ham)">P(ham) = 0.04</text>
