<line x1="975" y1="352" x2="1117" y2="352" class="grid"/>
<text x="1046.0" y="376" text-anchor="middle" class="i" style="font-size:13px">Distribution over labels only.</text>
<text x="1046.0" y="396" text-anchor="middle" class="i" style="font-size:13px">No distribution over emails.</text>
<text x="590.0" y="38" text-anchor="middle" class="m" style="font-size:15px">One shared <tspan style="font-weight:600">w, b</tspan> for every email — the same function maps any <tspan class="i">x</tspan> to <tspan class="i">P</tspan>(spam | <tspan class="i">x</tspan>)</text>
<text x="590.0" y="448" text-anchor="middle" class="small sans">Toy vocabulary V = {free, prize, click, meeting, report, thanks} · weights and bias are illustrative</text>
</svg>