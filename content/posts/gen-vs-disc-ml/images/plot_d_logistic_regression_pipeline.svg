<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d">
<title id="t">Logistic regression pipeline</title>
<desc id="d">Five stages left to right. An email reading "free prize free" becomes a bag-of-words count vector (2, 1, 0, 0, 0, 0). Each count is multiplied by a learned weight and summed with a bias to give a score z = 3.2. The sigmoid maps z to 0.96. The output is a bar showing P(spam) = 0.96 and P(ham) = 0.04, a distribution over labels only.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; --panel:#f5f6f9; --spam:#d6453d; --ham:#2f6fcf; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); font-size: 14px; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .h { font-size: 15px; font-weight: 600; }
  .m { font-size: 14px; font-style: italic; fill: var(--muted); }
  .small { font-size: 12px; fill: var(--muted); }
  .i { font-style: italic; }
  .halo { paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .card { fill: var(--panel); stroke: #dfe2ea; stroke-width: 1.2; }
  .arrow { fill: none; stroke: var(--line); stroke-width: 2; }
  .axis { stroke: var(--line); stroke-width: 1.4; fill: none; }
  .grid { stroke: #dfe2ea; stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1.2; }
  .pos { fill: var(--spam); } .neg { fill: var(--ham); }
  .dim { fill: #a3a9b8; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="var(--line)"/></marker>
</defs>
<rect width="1180" height="470" rx="10" fill="var(--bg)"/>
<rect x="39" y="64" width="190" height="350" rx="10" class="card"/>
<path d="M234,219.0 H261" class="arrow" marker-end="url(#head)"/>
<rect x="267" y="64" width="190" height="350" rx="10" class="card"/>
<path d="M462,219.0 H489" class="arrow" marker-end="url(#head)"/>
<rect x="495" y="64" width="190" height="350" rx="10" class="card"/>
<path d="M690,219.0 H717" class="arrow" marker-end="url(#head)"/>
<rect x="723" y="64" width="190" height="350" rx="10" class="card"/>
<path d="M918,219.0 H945" class="arrow" marker-end="url(#head)"/>
<rect x="951" y="64" width="190" height="350" rx="10" class="card"/>
<text x="134.0" y="94" text-anchor="middle" class="h sans">Email</text>
<text x="134.0" y="116" text-anchor="middle" class="m">x</text>
<g transform="translate(134.0 182)">
  <rect x="-34" y="-24" width="68" height="48" rx="4" fill="#fff" stroke="var(--ink)" stroke-width="1.8"/>
  <polyline points="-34,-23 0,4 34,-23" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
</g>
<rect x="59" y="238" width="150" height="52" rx="6" fill="#fff" stroke="var(--line)" stroke-width="1.4"/>
<text x="134.0" y="270" text-anchor="middle" style="font-size:17px" class="i">“free prize free”</text>
<text x="134.0" y="320" text-anchor="middle" class="small sans">raw text, variable length</text>
<text x="134.0" y="340" text-anchor="middle" class="small sans">m = 3 tokens</text>
<text x="362.0" y="94" text-anchor="middle" class="h sans">Bag of words</text>
<text x="362.0" y="116" text-anchor="middle" class="m">t(<tspan>x</tspan>)</text>
<text x="301" y="159" class="small sans" text-anchor="middle">word</text>
<text x="417" y="159" class="small sans" text-anchor="middle">count</text>
<rect x="281" y="168" width="162" height="24" rx="4" fill="#fff" stroke="var(--line)" stroke-width="1"/>
<text x="291" y="185" class="">free</text>
<text x="417" y="185" text-anchor="middle" class="" style="font-weight:700">2</text>
<rect x="281" y="194" width="162" height="24" rx="4" fill="#fff" stroke="var(--line)" stroke-width="1"/>
<text x="291" y="211" class="">prize</text>
<text x="417" y="211" text-anchor="middle" class="" style="font-weight:700">1</text>
<text x="291" y="237" class="dim">click</text>
<text x="417" y="237" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="291" y="263" class="dim">meeting</text>
<text x="417" y="263" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="291" y="289" class="dim">report</text>
<text x="417" y="289" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="291" y="315" class="dim">thanks</text>
<text x="417" y="315" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="362.0" y="354" text-anchor="middle" class="i">t(x) = (2, 1, 0, 0, 0, 0)</text>
<text x="362.0" y="374" text-anchor="middle" class="small sans">fixed length |V|, order lost</text>
<text x="590.0" y="94" text-anchor="middle" class="h sans">Linear combination</text>
<text x="590.0" y="116" text-anchor="middle" class="m">z = wᵀt(x) + b</text>
<text x="545" y="159" class="small sans" text-anchor="middle">weight w</text>
<text x="643" y="159" class="small sans" text-anchor="middle">w · count</text>
<rect x="509" y="168" width="162" height="24" rx="4" fill="#fff" stroke="var(--line)" stroke-width="1"/>
<text x="545" y="185" text-anchor="middle" class="pos" style="font-weight:600">+1.4</text>
<text x="643" y="185" text-anchor="middle" class="pos" style="font-weight:700">+2.8</text>
<rect x="509" y="194" width="162" height="24" rx="4" fill="#fff" stroke="var(--line)" stroke-width="1"/>
<text x="545" y="211" text-anchor="middle" class="pos" style="font-weight:600">+0.6</text>
<text x="643" y="211" text-anchor="middle" class="pos" style="font-weight:700">+0.6</text>
<text x="545" y="237" text-anchor="middle" class="dim" style="font-weight:600">+1.5</text>
<text x="643" y="237" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="545" y="263" text-anchor="middle" class="dim" style="font-weight:600">−1.4</text>
<text x="643" y="263" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="545" y="289" text-anchor="middle" class="dim" style="font-weight:600">−1.1</text>
<text x="643" y="289" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<text x="545" y="315" text-anchor="middle" class="dim" style="font-weight:600">−0.9</text>
<text x="643" y="315" text-anchor="middle" class="dim" style="font-weight:400">0</text>
<line x1="511" y1="328" x2="669" y2="328" class="rule"/>
<text x="519" y="350" class="i">+ b</text><text x="643" y="350" text-anchor="middle" class="neg" style="font-weight:600">−0.2</text>
<text x="590.0" y="382" text-anchor="middle" style="font-size:20px"><tspan class="i">z</tspan> = 3.2</text>
<text x="590.0" y="400" text-anchor="middle" class="small sans"><tspan class="pos" style="font-weight:600">+</tspan> pushes to spam · <tspan class="neg" style="font-weight:600">−</tspan> to ham</text>
<text x="818.0" y="94" text-anchor="middle" class="h sans">Sigmoid</text>
<text x="818.0" y="116" text-anchor="middle" class="m">σ(z) = 1 / (1 + e<tspan dy="-5" font-size="10.5">−z</tspan><tspan dy="5">)</tspan></text>
<line x1="761" y1="316.0" x2="897" y2="316.0" class="grid"/>
<text x="755" y="320.0" text-anchor="end" class="small sans">0</text>
<line x1="761" y1="233.0" x2="897" y2="233.0" class="grid"/>
<text x="755" y="237.0" text-anchor="end" class="small sans">0.5</text>
<line x1="761" y1="150.0" x2="897" y2="150.0" class="grid"/>
<text x="755" y="154.0" text-anchor="end" class="small sans">1</text>
<line x1="829.0" y1="146" x2="829.0" y2="316" class="grid"/>
