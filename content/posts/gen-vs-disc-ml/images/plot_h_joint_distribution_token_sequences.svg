<text x="389" y="286.0" text-anchor="middle" class="tok">cat</text>
<rect x="448" y="265.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="497" y="286.0" text-anchor="middle" class="tok">ran</text>
<rect x="618" y="264.0" width="290" height="32" rx="6" fill="#399f63" stroke="#b9d9c6" stroke-width="1"/>
<text x="763.0" y="285.5" text-anchor="middle" class="val" style="fill:#ffffff">2 × 10<tspan dy="-6" font-size="11">−4</tspan></text>
<text x="40" y="330.5" class="cat sans" style="fill:#a8731a">Grammatical, rare</text>
<line x1="30" y1="303" x2="930" y2="303" stroke="#e1e4ec" stroke-width="1"/>
<rect x="232" y="311.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="281" y="332.0" text-anchor="middle" class="tok">The</text>
