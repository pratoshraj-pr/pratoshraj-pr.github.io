<rect x="24" y="162" width="912" height="138" rx="10" fill="#e6f4ec" stroke="#1f8a4c" stroke-width="1.8"/>
<text x="40" y="192.5" class="cat sans" style="fill:#1f8a4c">Coherent</text>
<rect x="232" y="173.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="281" y="194.0" text-anchor="middle" class="tok">The</text>
<rect x="340" y="173.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="389" y="194.0" text-anchor="middle" class="tok">cat</text>
