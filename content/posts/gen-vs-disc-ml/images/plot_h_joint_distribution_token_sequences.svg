<rect x="232" y="403.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="281" y="424.0" text-anchor="middle" class="tok">Fast</text>
<rect x="340" y="403.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
