<text x="763.0" y="576" text-anchor="middle" class="small sans" style="font-size:11px">shading on a log scale (spans almost five orders of magnitude)</text>
<text x="480.0" y="622" text-anchor="middle" class="i" style="font-size:17px">Coherent sequences get high probability. The model knows what plausible text looks like.</text>
