<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
<title id="t">A language model assigns probability to whole sequences</title>
<desc id="d">A table of eight three-token sequences with the probability P(x) of each whole sequence, shaded from green for high to white for low. The coherent sequences The cat sat (0.00056), She ran fast (0.0003) and The cat ran (0.0002) are highlighted and have the highest probability. Grammatical but rare The mat sat is about 4 times 10 to the minus 6, incoherent sequences such as Sat the cat are around 10 to the minus 6 or lower, and the random string Fast sat mat is 10 to the minus 8.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); font-size: 15px; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .small { font-size: 12.5px; fill: var(--muted); }
  .i { font-style: italic; }
  .tok { font-size: 17px; }
  .val { font-size: 15px; font-weight: 600; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .cat { font-size: 12.5px; font-weight: 600; }
</style>
<rect width="960" height="650" rx="10" fill="var(--bg)"/>
<text x="480.0" y="40" text-anchor="middle" style="font-size:21px">A language model scores <tspan class="i">whole sequences</tspan></text>
<text x="480.0" y="64" text-anchor="middle" class="small sans" style="font-size:13.5px">Toy vocabulary {The, cat, sat, on, mat, ran, she, fast} · illustrative numbers: the ranking matters, not the exact values</text>
<text x="40" y="130" class="small sans" style="font-weight:600">TYPE OF TEXT</text>
<text x="232" y="130" class="small sans" style="font-weight:600">3-TOKEN SEQUENCE  <tspan class="i" style="font-family:Georgia,serif;font-weight:400">x</tspan> = (<tspan class="i" style="font-family:Georgia,serif;font-weight:400">x</tspan><tspan style="font-family:Georgia,serif;font-weight:400;font-size:13px">₁</tspan>, <tspan class="i" style="font-family:Georgia,serif;font-weight:400">x</tspan><tspan style="font-family:Georgia,serif;font-weight:400;font-size:13px">₂</tspan>, <tspan class="i" style="font-family:Georgia,serif;font-weight:400">x</tspan><tspan style="font-family:Georgia,serif;font-weight:400;font-size:13px">₃</tspan>)</text>
<text x="763.0" y="120" text-anchor="middle" style="font-size:16px"><tspan class="i">P</tspan>(<tspan class="i">x</tspan>) = <tspan class="i">P</tspan>(<tspan class="i">x</tspan>₁, <tspan class="i">x</tspan>₂, <tspan class="i">x</tspan>₃)</text>
<text x="763.0" y="139" text-anchor="middle" class="small sans" style="font-size:12px">joint probability of the whole sequence, not conditional</text>
