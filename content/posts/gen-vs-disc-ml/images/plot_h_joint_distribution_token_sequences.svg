<text x="763.0" y="193.5" text-anchor="middle" class="val" style="fill:#ffffff">5.6 × 10<tspan dy="-6" font-size="11">−4</tspan><tspan dy="6" style="font-weight:400;font-size:12.5px">  = 0.00056</tspan></text>
<rect x="232" y="219.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
<text x="281" y="240.0" text-anchor="middle" class="tok">She</text>
