<text x="40" y="376.5" class="cat sans" style="fill:#b5472f">Incoherent</text>
<line x1="30" y1="349" x2="930" y2="349" stroke="#e1e4ec" stroke-width="1"/>
<rect x="232" y="357.0" width="98" height="30" rx="7" fill="#ffffff" stroke="#c4c9d6" stroke-width="1.2"/>
