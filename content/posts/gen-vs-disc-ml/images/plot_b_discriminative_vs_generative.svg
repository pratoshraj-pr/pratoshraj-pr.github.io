<text x="230.0" y="74" text-anchor="middle" class="sub sans">What the model learns: only where the classes separate</text>
<text x="670.0" y="52" text-anchor="middle" class="title">Generative: <tspan class="it">P</tspan>(<tspan class="it">x</tspan> | <tspan class="it">y</tspan>) <tspan class="it">P</tspan>(<tspan class="it">y</tspan>)</text>
<text x="670.0" y="74" text-anchor="middle" class="sub sans">What the model learns: how each class is spread out</text>
