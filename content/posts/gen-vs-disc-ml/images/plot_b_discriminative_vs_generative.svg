<clipPath id="clip1"><rect x="480" y="100" width="380" height="300" rx="6"/></clipPath>
<linearGradient id="band" gradientUnits="userSpaceOnUse" x1="220.5" y1="263.5" x2="239.5" y2="230.7">
  <stop offset="0" stop-color="var(--ham)" stop-opacity="0"/><stop offset="0.28" stop-color="var(--ham)" stop-opacity="0.38"/>
  <stop offset="0.5" stop-color="var(--mid)" stop-opacity="0.5"/>
  <stop offset="0.72" stop-color="var(--spam)" stop-opacity="0.38"/><stop offset="1" stop-color="var(--spam)" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="900" height="540" rx="10" fill="var(--bg)"/>
