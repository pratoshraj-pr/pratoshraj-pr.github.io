<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Discriminative vs generative: what the model sees</title>
<desc id="d">Two panels show the same spam and ham points in a two-dimensional input space. The discriminative panel highlights only a band around the decision boundary. The generative panel shows density contours for both classes across the whole space, with the same boundary drawn dashed because it is derived.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; --frame:#c4c9d6; --mid:#8a6fb0; --spam:#d6453d; --ham:#2f6fcf; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 20px; } .cap { font-size: 16px; font-weight: 600; }
  .sub { font-size: 13px; fill: var(--muted); } .ax { font-size: 14px; font-style: italic; fill: var(--muted); }
  .small { font-size: 12px; fill: var(--muted); font-style: italic; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
  .axis { stroke: var(--line); stroke-width: 1.4; fill: none; }
  .pt { stroke: var(--bg); stroke-width: 1.4; } .pt.spam { fill: var(--spam); } .pt.ham { fill: var(--ham); }
  .bnd { stroke: var(--ink); stroke-width: 2.4; fill: none; }
  .bnd.dash { stroke-dasharray: 8 6; }
  .cs { fill: var(--spam); stroke: var(--spam); stroke-width: 1.4; } .ch { fill: var(--ham); stroke: var(--ham); stroke-width: 1.4; }
  .it { font-style: italic; }
</style>
