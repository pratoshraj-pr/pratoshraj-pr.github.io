<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
<title id="t">Naive Bayes classification: spam score versus ham score</title>
<desc id="d">Grouped bar chart on a log scale. For the email "free prize" the spam score 0.030 towers over the ham score 0.00012, giving P(spam | x) of about 0.996. For "meeting report thanks" the spam score 0.000036 is tiny next to the ham score 0.01575, giving P(spam | x) of about 0.0023. The class with the higher score wins.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; --spam:#d6453d; --ham:#2f6fcf; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); font-size: 14px; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .small { font-size: 12px; fill: var(--muted); }
  .i { font-style: italic; }
  .grid { stroke: #e3e6ee; stroke-width: 1; }
  .axis { stroke: var(--line); stroke-width: 1.4; }
  .val { font-size: 13.5px; font-weight: 600; }
</style>
<rect width="960" height="580" rx="10" fill="var(--bg)"/>
<text x="480.0" y="40" text-anchor="middle" style="font-size:20px"><tspan class="i">P</tspan>(spam | <tspan class="i">x</tspan>) = <tspan style="fill:var(--spam);font-weight:600">spam score</tspan> / (<tspan style="fill:var(--spam);font-weight:600">spam score</tspan> + <tspan style="fill:var(--ham);font-weight:600">ham score</tspan>)</text>
<text x="480.0" y="64" text-anchor="middle" class="small sans" style="font-size:13px">score = <tspan class="i">P</tspan>(<tspan class="i">x</tspan> | <tspan class="i">y</tspan>) <tspan class="i">P</tspan>(<tspan class="i">y</tspan>) for each class</text>
<line x1="130" y1="460.0" x2="910" y2="460.0" class="grid"/>
<text x="120" y="464.5" text-anchor="end" class="sans small" style="font-size:12.5px">10<tspan dy="-5" font-size="9.5">−5</tspan></text>
<line x1="130" y1="385.0" x2="910" y2="385.0" class="grid"/>
<text x="120" y="389.5" text-anchor="end" class="sans small" style="font-size:12.5px">10<tspan dy="-5" font-size="9.5">−4</tspan></text>
<line x1="130" y1="310.0" x2="910" y2="310.0" class="grid"/>
<text x="120" y="314.5" text-anchor="end" class="sans small" style="font-size:12.5px">10<tspan dy="-5" font-size="9.5">−3</tspan></text>
<line x1="130" y1="235.0" x2="910" y2="235.0" class="grid"/>
<text x="120" y="239.5" text-anchor="end" class="sans small" style="font-size:12.5px">10<tspan dy="-5" font-size="9.5">−2</tspan></text>
<line x1="130" y1="160.0" x2="910" y2="160.0" class="grid"/>
<text x="120" y="164.5" text-anchor="end" class="sans small" style="font-size:12.5px">10<tspan dy="-5" font-size="9.5">−1</tspan></text>
<line x1="130" y1="152" x2="130" y2="460" class="axis"/>
<line x1="130" y1="460" x2="910" y2="460" class="axis"/>
<text transform="translate(52 310.0) rotate(-90)" text-anchor="middle" style="font-size:15px"><tspan class="i">P</tspan>(<tspan class="i">x</tspan> | <tspan class="i">y</tspan>) <tspan class="i">P</tspan>(<tspan class="i">y</tspan>)</text>
<text transform="translate(72 310.0) rotate(-90)" text-anchor="middle" class="small sans">(log scale)</text>
<rect x="232.0" y="199.2" width="84" height="260.8" rx="2" fill="var(--spam)"/>
<text x="274.0" y="191.2" text-anchor="middle" class="val sans" style="fill:var(--spam)">0.030</text>
<text x="274.0" y="478" text-anchor="middle" class="small sans" style="font-size:13px;font-weight:600;fill:var(--spam)">spam</text>
<rect x="334.0" y="379.1" width="84" height="80.9" rx="2" fill="var(--ham)"/>
<text x="376.0" y="371.1" text-anchor="middle" class="val sans" style="fill:var(--ham)">0.00012</text>
<text x="376.0" y="478" text-anchor="middle" class="small sans" style="font-size:13px;font-weight:600;fill:var(--ham)">ham</text>
<text x="325.0" y="504" text-anchor="middle" class="i" style="font-size:17px">“free prize”</text>
<rect x="207.0" y="96" width="236" height="28" rx="14" fill="var(--spam)"/>
<text x="325.0" y="115" text-anchor="middle" style="fill:#fff;font-size:15px"><tspan class="i">P</tspan>(spam | <tspan class="i">x</tspan>) ≈ <tspan style="font-weight:700">0.996</tspan>  →  <tspan class="sans" style="font-weight:600;font-size:13.5px">spam</tspan></text>
<rect x="622.0" y="418.3" width="84" height="41.7" rx="2" fill="var(--spam)"/>
<text x="664.0" y="410.3" text-anchor="middle" class="val sans" style="fill:var(--spam)">0.000036</text>
<text x="664.0" y="478" text-anchor="middle" class="small sans" style="font-size:13px;font-weight:600;fill:var(--spam)">spam</text>
<rect x="724.0" y="220.2" width="84" height="239.8" rx="2" fill="var(--ham)"/>
<text x="766.0" y="212.2" text-anchor="middle" class="val sans" style="fill:var(--ham)">0.01575</text>
<text x="766.0" y="478" text-anchor="middle" class="small sans" style="font-size:13px;font-weight:600;fill:var(--ham)">ham</text>
<text x="715.0" y="504" text-anchor="middle" class="i" style="font-size:17px">“meeting report thanks”</text>
<rect x="597.0" y="96" width="236" height="28" rx="14" fill="var(--ham)"/>
<text x="715.0" y="115" text-anchor="middle" style="fill:#fff;font-size:15px"><tspan class="i">P</tspan>(spam | <tspan class="i">x</tspan>) ≈ <tspan style="font-weight:700">0.0023</tspan>  →  <tspan class="sans" style="font-weight:600;font-size:13.5px">ham</tspan></text>
<text x="480.0" y="550" text-anchor="middle" class="i" style="font-size:16px">Both classes assign a score. The class with the higher score wins.</text>
<text x="480.0" y="570" text-anchor="middle" class="small sans" style="font-size:11.5px">Toy model: prior π = 0.4 for spam · log axis: bars are drawn from 10⁻⁵, so heights show orders of magnitude, not linear size</text>
</svg>