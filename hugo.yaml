baseURL: "https://pratoshraj-pr.github.io/"
locale: "en-us"
title: "PR Logs"

security:
  allowContent:
    - ".*"

theme: "PaperMod"
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "PR Logs"
  description: "Technical notes on machine learning, statistics, and the occasional deep dive."
  author: "Pratosh Raj"
  googleAnalyticsID: "G-QF31SB7ZP5"   # GA4 Measurement ID, e.g. G-XXXXXXXXXX
  images:
    - "/images/og-default.png"
  DateFormat: "January 2, 2006"
  defaultTheme: auto          # auto = respect OS preference; user can toggle
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons: [x, linkedin, reddit, facebook, whatsapp, telegram]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  math: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  label:
    text: "PR Logs"

  homeInfoParams:
    Title: "PR Logs"
    Content: |
      Hi, and welcome to my blog! I'm Pratosh Raj, a data scientist now exploring
      post-training for LLMs, alignment, and safety. This blog documents what I learn
      along the way, and I'm sharing it so others can benefit too.

  socialIcons:
    - name: github
      url: "https://github.com/pratoshraj-pr"
    - name: linkedin
      url: "https://www.linkedin.com/in/pratosh-raj-56052b161/"
    - name: rss
      url: "/index.xml"

  assets:
    disableHLJS: false
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/pratoshraj-pr/pratoshraj-pr.github.io/blob/main/content"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON   # needed for PaperMod's built-in search

markup:
  goldmark:
    renderer:
      unsafe: true     # allow raw HTML (needed for <details> tags in the post)
    parser:
      attribute:
        block: true    # allows {.caption} on the line after a figure caption
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    style: monokai
    lineNos: false
    codeFences: true
    guessSyntax: true
