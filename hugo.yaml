baseURL: "https://pratoshraj-pr.github.io/"
languageCode: "en-us"
title: "PR Logs"
theme: "PaperMod"
paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "PR Logs"
  description: "Technical notes on machine learning, statistics, and the occasional deep dive."
  author: "pratoshraj-pr"
  DateFormat: "January 2, 2006"
  defaultTheme: auto          # auto = respect OS preference; user can toggle
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  label:
    text: "PR Logs"

  homeInfoParams:
    Title: "PR Logs"
    Content: |
      Technical deep-dives on machine learning, probability, and statistics.
      Written to be understood, not just cited.

  socialIcons:
    - name: github
      url: "https://github.com/pratoshraj-pr"

  assets:
    disableHLJS: false

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/pratoshraj-pr/pratoshraj-pr.github.io/blob/main/quarto"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON   # needed for PaperMod's built-in search

markup:
  goldmark:
    renderer:
      unsafe: true     # allow raw HTML (needed for <details> tags in the post)
  highlight:
    noClasses: false
    style: monokai
    lineNos: false
    codeFences: true
    guessSyntax: true
