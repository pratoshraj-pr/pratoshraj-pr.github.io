<text x="22" y="486" class="sans small" style="font-size:12px;font-weight:600">CHAIN RULE: THE PRODUCT OF THE THREE HIGHLIGHTED BARS</text>
<text x="600.0" y="604" text-anchor="middle" style="font-size:21px"><tspan class="i">P</tspan>(The cat sat) = 0.01 × 0.08 × 0.70 = <tspan style="font-weight:700;fill:#1f8a4c">0.00056</tspan></text>
<text x="600.0" y="676" text-anchor="middle" class="i" style="font-size:16px">Each step is a small problem: one distribution over |V| tokens. The product of those answers is the probability of the whole text.</text>
