  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); font-size: 15px; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .small { font-size: 12px; fill: var(--muted); }
  .i { font-style: italic; }
  .lab { font-size: 13px; }
  .arrow { fill: none; stroke: var(--sel); stroke-width: 2; }
</style>
