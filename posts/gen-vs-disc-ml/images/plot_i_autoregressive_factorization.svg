<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Autoregressive factorization of a text probability</title>
<desc id="d">Three bar charts left to right, each a categorical distribution over the same ten-word vocabulary. Stage 1, P(x1), highlights The at 0.01 with context empty. Stage 2, P(x2 given The), highlights cat at 0.08 with context The. Stage 3, P(x3 given The cat), highlights sat at 0.70 with context The cat. Arrows feed each chosen token back into the next context. Below, P(The cat sat) equals 0.01 times 0.08 times 0.70, which is 0.00056.</desc>
