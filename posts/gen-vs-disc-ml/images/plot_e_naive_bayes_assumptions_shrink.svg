<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1332 560" width="1332" height="560" role="img" aria-labelledby="t d">
<title id="t">How the Naive Bayes assumptions shrink the distribution</title>
<desc id="d">Three panels showing the class-conditional distribution P(x | y = c). Panel 1, no assumptions: a vast grid of |V|^m outcomes needing 2(|V|^m - 1) + 1 parameters. Panel 2, conditional independence: m separate bar charts over |V| words, needing 2m(|V| - 1) + 1 parameters. Panel 3, position independence: a single bar chart over the six toy-vocabulary words shared by all m positions, needing 2(|V| - 1) + 1 parameters.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; --panel:#f5f6f9; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); font-size: 14px; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .h { font-size: 16px; font-weight: 600; }
  .m { font-size: 14px; font-style: italic; fill: var(--muted); }
  .small { font-size: 11.5px; fill: var(--muted); }
  .i { font-style: italic; }
  .card { fill: var(--panel); stroke: #dfe2ea; stroke-width: 1.2; }
  .arrow { fill: none; stroke: var(--line); stroke-width: 2; }
  .axis { stroke: var(--line); stroke-width: 1.3; }
  .rule { stroke: #dfe2ea; stroke-width: 1; }
  .cap { font-size: 19px; }
  .alab { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
</style>
