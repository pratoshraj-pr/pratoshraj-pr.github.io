<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">The true distribution P* and i.i.d. sampling</title>
<desc id="d">A large faded cloud of spam and ham emails representing the unknown true distribution P*(x, y). Four curved arrows labelled i.i.d. draw lead from the cloud to a small bounded box holding eight labelled emails, the observed training set D.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1f2330; --muted:#5b6275; --line:#8a92a6; --cloud:#8a92a6; --spam:#d6453d; --ham:#2f6fcf; }
  text { font-family: Georgia, 'Times New Roman', serif; fill: var(--ink); }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 22px; }
  .sub { font-size: 13.5px; fill: var(--muted); }
  .lab { font-size: 12.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; font-style: italic; }
  .tag { font-size: 11.5px; font-weight: 600; }
  .note { font-size: 15px; font-style: italic; }
  .spam .env { fill: var(--spam); fill-opacity: .16; stroke: var(--spam); }
  .ham .env { fill: var(--ham); fill-opacity: .16; stroke: var(--ham); }
  .spam .flap { stroke: var(--spam); } .ham .flap { stroke: var(--ham); }
  .env { stroke-width: 1.4; } .flap { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
  .tagbg.spam { fill: var(--spam); } .tagbg.ham { fill: var(--ham); }
  .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; }
  .box { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .big { font-style: italic; }
</style>
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="var(--line)"/></marker>
</defs>
<rect width="900" height="500" rx="10" fill="var(--bg)"/>

<text x="240" y="46" text-anchor="middle" class="title big">P<tspan dy="-6" font-size="15" font-style="normal">*</tspan><tspan dy="6" font-style="normal">(</tspan>x, y<tspan font-style="normal">)</tspan></text>
<text x="240" y="68" text-anchor="middle" class="sub sans">True data-generating distribution (unknown)</text>
<text x="750" y="46" text-anchor="middle" class="title"><tspan class="big">D</tspan> = {(<tspan class="big">x</tspan>ᵢ, <tspan class="big">y</tspan>ᵢ)}<tspan font-size="15">ⁿ</tspan><tspan font-size="15" dx="-9" dy="3">ᵢ₌₁</tspan></text>
<text x="750" y="68" text-anchor="middle" class="sub sans">Training set (observed)</text>

